name: Production Check
# Current production trigger: Cloudflare must build the newest main commit, not retry an older deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-check
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build production app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Next.js build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Production URL health check
        if: success()
        continue-on-error: true
        run: |
          echo "Build aprovado. O Cloudflare conectado ao GitHub publica a branch main automaticamente."
          echo "Após a publicação, o endpoint de saúde pode ser conferido em:"
          echo "https://comunivisual-ai.immgcv.workers.dev/api/health"
